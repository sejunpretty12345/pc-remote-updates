name: Build PhonePilot A17 Lite APK
on:
  workflow_dispatch:
  push:
    branches: [phonepilot-a17, phonepilot-a17-safe]
    paths: ['PhonePilotA17/**', '.github/workflows/build-android.yml']
  pull_request:
    branches: [main]
    paths: ['PhonePilotA17/**', '.github/workflows/build-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: PhonePilotA17
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature and launcher icon
        working-directory: PhonePilotA17
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/phonepilot-badging.txt
          grep 'application-icon-' /tmp/phonepilot-badging.txt
          echo "----- Permissions -----"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/phonepilot-permissions.txt
          if grep -E "BIND_ACCESSIBILITY_SERVICE|READ_CALENDAR|FOREGROUND_SERVICE|POST_NOTIFICATIONS" /tmp/phonepilot-permissions.txt; then
            echo "Unexpected sensitive permission in lite APK."
            exit 1
          fi
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "PilotAccessibilityService.class"; then
            echo "Unexpected AccessibilityService class."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PhonePilotA17-Lite-debug-apk
          path: PhonePilotA17/app/build/outputs/apk/debug/app-debug.apk
