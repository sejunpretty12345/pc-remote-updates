name: Build PhonePilot AI A17 Assistant APK
on:
  workflow_dispatch:
  push:
    branches: [phonepilot-a17-assistant]
  pull_request:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        working-directory: PhonePilotA17
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify signer icon and permissions
        working-directory: PhonePilotA17
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep 'application-icon-' /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/perms.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|READ_CALENDAR|QUERY_ALL_PACKAGES|SEND_SMS|CALL_PHONE|READ_CONTACTS|SYSTEM_ALERT_WINDOW' /tmp/perms.txt; then
            echo 'Forbidden permission found in app manifest'
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhonePilotAI-A17-assistant-apk
          path: PhonePilotA17/app/build/outputs/apk/debug/app-debug.apk
