name: Build PhonePilot A17 APK
on:
  workflow_dispatch:
  push:
    branches: [phonepilot-a17]
    paths: ['PhonePilotA17/**', '.github/workflows/build-android.yml']
  pull_request:
    branches: [main]
    paths: ['PhonePilotA17/**', '.github/workflows/build-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: PhonePilotA17
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PhonePilotA17-debug-apk
          path: PhonePilotA17/app/build/outputs/apk/debug/app-debug.apk
